<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}My University{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 850px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #222; }
        header, footer { background: #f1f4f8; padding: 16px 20px; border-radius: 8px; }
        main { padding: 20px 0; }
        a { color: #1558a6; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 12px 0; }
    </style>
</head>
<body>
    <header><h1>My University</h1></header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>Week 04 – Django Templates and ORM</footer>
</body>
</html>
