{% extends "myApp/base.html" %}

{% block content %}
    <h2>Students</h2>
    <ul class="student-list">
        {% for student in students %}
            <li>
                <a href="{% url 'student_detail' student.id %}">
                    {{ student.firstName|capfirst }} {{ student.lastName|upper }}
                </a>
            </li>
        {% empty %}
            <li>No students in the database yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
