<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1 - Bill Splitter</title>
    <link rel="stylesheet" href="style.css">
    <script src="task1.js" defer></script>
</head>
<body>
    <header>
        <h1>Bill Splitter</h1>
        <nav>
            <a href="task1.html">Task 1</a>
            <a href="task2.html">Task 2</a>
            <a href="task3.html">Task 3</a>
        </nav>
    </header>

    <main class="card">
        <h2>Calculate the bill</h2>
        <form id="billForm" novalidate>
            <label for="billAmount">Total bill amount</label>
            <input type="number" id="billAmount" placeholder="e.g. 2500" min="0" step="0.01">

            <label for="tipRate">Tip rate</label>
            <select id="tipRate">
                <option value="0">0%</option>
                <option value="5">5%</option>
                <option value="10" selected>10%</option>
                <option value="15">15%</option>
                <option value="20">20%</option>
            </select>

            <label for="people">Number of people</label>
            <input type="number" id="people" placeholder="e.g. 4" min="1" step="1">

            <button type="submit">Calculate</button>
        </form>

        <div id="errors" class="errors" aria-live="polite"></div>
        <section id="result" class="result" aria-live="polite">
            <h3>Bill summary</h3>
            <p>Enter the details and select Calculate.</p>
        </section>
    </main>
</body>
</html>
