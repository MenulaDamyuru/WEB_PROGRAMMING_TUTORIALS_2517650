<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - ToDo List</title>
    <link rel="stylesheet" href="style.css">
    <script src="task3.js" defer></script>
</head>
<body>
    <header>
        <h1>My ToDo List</h1>
        <nav>
            <a href="task1.html">Task 1</a>
            <a href="task2.html">Task 2</a>
            <a href="task3.html">Task 3</a>
        </nav>
    </header>

    <main class="card">
        <h2>Add a task</h2>
        <form id="todoForm" class="item-form">
            <div>
                <label for="todoInput">Task description</label>
                <input type="text" id="todoInput" placeholder="e.g. Complete web programming assignment">
            </div>
            <button type="submit">Add task</button>
        </form>

        <div id="todoError" class="errors" aria-live="polite"></div>

        <h3>Your tasks</h3>
        <ul id="todoList" class="todo-list"></ul>
        <p class="note">Completed tasks can be ticked. The list is temporary and clears when the page is refreshed.</p>
    </main>
</body>
</html>
