<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Menu Bill Splitter</title>
    <link rel="stylesheet" href="style.css">
    <script src="task2.js" defer></script>
</head>
<body>
    <header>
        <h1>Menu Bill Splitter</h1>
        <nav>
            <a href="task1.html">Task 1</a>
            <a href="task2.html">Task 2</a>
            <a href="task3.html">Task 3</a>
        </nav>
    </header>

    <main class="card">
        <h2>Add menu items</h2>
        <p>Add each item and its cost. The bill total is calculated from your list.</p>

        <form id="itemForm" class="item-form" novalidate>
            <div>
                <label for="itemName">Menu item</label>
                <input type="text" id="itemName" placeholder="e.g. Rice and curry">
            </div>
            <div>
                <label for="itemCost">Cost (Rs.)</label>
                <input type="number" id="itemCost" placeholder="e.g. 850" min="0" step="0.01">
            </div>
            <button type="submit">Add item</button>
        </form>

        <div id="errors" class="errors" aria-live="polite"></div>

        <h3>Items added</h3>
        <ul id="itemList" class="item-list">
            <li class="empty">No items added yet.</li>
        </ul>

        <div class="split-options">
            <label for="tipRate">Tip rate</label>
            <select id="tipRate">
                <option value="0">0%</option>
                <option value="5">5%</option>
                <option value="10" selected>10%</option>
                <option value="15">15%</option>
                <option value="20">20%</option>
            </select>

            <label for="people">Number of people</label>
            <input type="number" id="people" placeholder="e.g. 4" min="1" step="1">

            <button type="button" id="calculateButton">Calculate total and split</button>
        </div>

        <section id="result" class="result" aria-live="polite">
            <h3>Bill summary</h3>
            <p>Add menu items, enter the number of people and calculate.</p>
        </section>
    </main>
</body>
</html>
