{% extends "myApp/base.html" %}
{% load static %}

{% block content %}
    <div class="px-4 py-5 my-5 text-center hero">
        <img class="d-block mx-auto mb-4" src="{% static 'myApp/aru.jpg' %}"
             alt="Anglia Ruskin University" width="1000" height="485">
        <h1 class="display-5 fw-bold text-body-emphasis">Web Programming</h1>
        <div class="col-lg-6 mx-auto">
            <p class="lead mb-4">
                A simple example application for the Web Programming Module.
            </p>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <a class="btn btn-primary btn-lg px-4 gap-3"
                   href="{% url 'myApp:studentlist' 1 %}">Students</a>
                <a class="btn btn-outline-secondary btn-lg px-4"
                   href="{% url 'myApp:modulelist' 1 %}">Modules</a>
            </div>
        </div>
    </div>
{% endblock %}
