{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Nigel's University{% endblock %}</title>

    <!-- Bootstrap CSS served from our own static files -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'myApp/site.css' %}" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'myApp:home' %}">My University</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}"
                           href="{% url 'myApp:home' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'studentlist' %}active{% endif %}"
                           href="{% url 'myApp:studentlist' 1 %}">Students</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'modulelist' %}active{% endif %}"
                           href="{% url 'myApp:modulelist' 1 %}">Modules</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="container py-4 text-body-secondary border-top">
        <p class="mb-0">My footer from base.html &middot; MOD002619 Web Programming</p>
    </footer>

    <!-- Bootstrap JavaScript at the end of the body for faster loading -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
